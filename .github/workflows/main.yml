name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Ekstrak proyek
        run: unzip -q TemanLayar-Android.zip
      - name: Bangun APK
        working-directory: TemanLayar
        run: gradle assembleDebug --no-daemon
      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            TemanLayar/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Teman Layar ${{ github.run_number }}" \
            --notes "APK debug Teman Layar"
